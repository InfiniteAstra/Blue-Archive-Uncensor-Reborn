name: Blue Archive Uncensor

on:
  workflow_dispatch:

  schedule:
    - cron: "0 8 * * *"

concurrency:
  group: blue-archive-resource-update
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      # ====================================================
      # Checkout
      # ====================================================

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: true # AssetExclusions 中的 .bundle 如果用了 Git LFS，必须开启

      # ====================================================
      # Python
      # ====================================================

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      # ====================================================
      # Dependencies
      # ====================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # ====================================================
      # 获取当前官方版本
      # ====================================================

      - name: Get current version
        id: version
        run: |
          python scripts/getCurrentVersion.py \
            --json-output .current_version.json \
            --github-output

      # ====================================================
      # 比较版本 + 生成资源 + 打包 zip
      # ====================================================

      - name: Process resources
        id: process
        run: |
          python scripts/update_resources.py \
            --current-version-file .current_version.json \
            --github-output

      # ====================================================
      # 发布 GitHub Release
      # ====================================================

      - name: Publish GitHub Release
        if: steps.process.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ZIP_PATH: ${{ steps.process.outputs.zip_path }}
          ZIP_NAME: ${{ steps.process.outputs.zip_name }}
          GAME_VERSION: ${{ steps.version.outputs.game_version }}
          RESOURCE_VERSION: ${{ steps.version.outputs.resource_version }}
          TABLE_VERSION: ${{ steps.version.outputs.table_version }}
        run: |
          TAG="v${RESOURCE_VERSION}-${TABLE_VERSION}"
          TITLE="${ZIP_NAME%.zip}"
          NOTES="GameVersion: ${GAME_VERSION}
          ResourceVersion: ${RESOURCE_VERSION}
          TableVersion: ${TABLE_VERSION}"

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} 已存在，覆盖上传资源"
            gh release upload "${TAG}" "${ZIP_PATH}" --clobber
          else
            gh release create "${TAG}" "${ZIP_PATH}" \
              --target "${GITHUB_SHA}" \
              --title "${TITLE}" \
              --notes "${NOTES}"
          fi

      # ====================================================
      # 更新 current.txt（Release 成功后才推进版本）
      # ====================================================

      - name: Update current.txt
        if: steps.process.outputs.changed == 'true'
        run: |
          python scripts/updateCurrentVersion.py \
            --resource-version "${{ steps.version.outputs.resource_version }}" \
            --table-version "${{ steps.version.outputs.table_version }}"

      # ====================================================
      # Commit
      # ====================================================

      - name: Commit current.txt
        if: steps.process.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add current.txt

          if git diff --cached --quiet; then
            echo "current.txt 没有变化"
            exit 0
          fi

          git commit -m \
            "Update resources: ResourceVersion ${{ steps.version.outputs.resource_version }}, TableVersion ${{ steps.version.outputs.table_version }}"

      # ====================================================
      # Push
      # ====================================================

      - name: Push changes
        if: steps.process.outputs.changed == 'true'
        run: |
          git push origin "HEAD:${GITHUB_REF_NAME}"
